:root {
  --ink: #000000;          /* the page is the same black as the post */
  --surface: #0d0c0b;      /* fields and sheets, barely lifted */
  --bone: #eee9e0;         /* primary type */
  --ash: #8e887f;          /* secondary type */
  --ash-dim: #5c5751;      /* placeholders, quiet hints */
  --rule: #1f1d1b;         /* hairlines */
  --rule-strong: #35322e;  /* control borders */
  --ember: #e4572e;        /* the match head: selection, live status, focus */
  --ember-soft: rgba(228, 87, 46, 0.14);

  --sans: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;

  --column: 44rem;
  --gutter: clamp(1.25rem, 4vw, 2.5rem);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--bone);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: rgba(228, 87, 46, 0.35); color: var(--bone); }
:focus-visible { outline: 1px solid var(--ember); outline-offset: 3px; }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
[hidden] { display: none !important; }

.shell {
  max-width: calc(var(--column) + var(--gutter) * 2);
  margin: 0 auto;
  padding: 0 var(--gutter) 8rem;
}

/* ---------- Masthead ---------- */

.masthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: clamp(1.5rem, 5vw, 3rem) 0 clamp(1.75rem, 5vw, 3rem);
}
.mark { display: flex; align-items: center; gap: 0.85rem; }
.match { width: 18px; height: 30px; flex: none; }
.match line { stroke: var(--bone); stroke-width: 2.2; stroke-linecap: round; }
.match path { fill: var(--ember); }
.wordmark {
  margin: 0;
  font-weight: 800;
  font-size: 1.55rem;
  letter-spacing: 0.035em;
  line-height: 1;
}
.studio {
  margin: 0.4rem 0 0;
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0.24em;
  color: var(--ash);
  line-height: 1;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  background: none;
  border: 0;
  padding: 0.5rem 0;
  color: var(--ash);
  font-size: 0.82rem;
}
.status:hover { color: var(--bone); }
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  border: 1px solid var(--ash-dim);
  background: transparent;
}
.status[data-state="online"] .status-dot { background: var(--ember); border-color: var(--ember); }
.status[data-state="demo"] .status-dot { border-color: var(--ember); }
.status[data-state="demo"] { color: var(--bone); }
.status[data-state="offline"] .status-dot { background: transparent; border-color: var(--ember); border-style: dashed; }
.status[data-state="checking"] .status-dot { animation: pulse 1.2s ease-in-out infinite; }

/* ---------- Composer ---------- */

.theme {
  display: block;
  width: 100%;
  resize: none;
  overflow: hidden;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--rule-strong);
  padding: 0.25rem 0 0.9rem;
  font-size: clamp(1.25rem, 3.2vw, 1.6rem);
  line-height: 1.35;
  font-weight: 400;
  color: var(--bone);
}
.theme::placeholder { color: var(--ash-dim); }
.theme:focus { outline: none; border-bottom-color: var(--ash); }

.composer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 1.25rem;
  flex-wrap: wrap;
}
.composer-options { display: flex; gap: 0.6rem; flex-wrap: wrap; }
.select { position: relative; display: inline-block; }
.select select {
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  padding: 0.55rem 2rem 0.55rem 0.8rem;
  font-size: 0.88rem;
  color: var(--bone);
  min-height: 42px;
}
.select select option { background: #111; color: var(--bone); }
.select::after {
  content: "";
  position: absolute;
  right: 0.85rem; top: 50%;
  width: 6px; height: 6px;
  border-right: 1px solid var(--ash);
  border-bottom: 1px solid var(--ash);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
.select select:hover { border-color: var(--ash-dim); }

.button {
  border-radius: 2px;
  border: 1px solid transparent;
  padding: 0.62rem 1.15rem;
  min-height: 42px;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  background: none;
  white-space: nowrap;
  transition: color 120ms ease, background-color 120ms ease, border-color 120ms ease;
}
.button.primary { background: var(--bone); color: var(--ink); }
.button.primary:hover { background: #fff; }
.button.primary:disabled { background: var(--rule-strong); color: var(--ash); cursor: default; }
.button.quiet { color: var(--ash); padding-left: 0.6rem; padding-right: 0.6rem; }
.button.quiet:hover { color: var(--bone); }
.button.quiet:disabled { color: var(--ash-dim); cursor: default; }
.button.danger:hover { color: var(--ember); }
.button.outline { border-color: var(--rule-strong); color: var(--bone); }
.button.outline:hover { border-color: var(--bone); }
.batch-head > .button.quiet { margin-right: -0.6rem; flex: none; }
#generate { min-width: 8.5rem; }

.notice {
  margin-top: 1.5rem;
  padding: 1rem 1.1rem;
  border-left: 2px solid var(--ember);
  background: var(--surface);
  font-size: 0.95rem;
}
.notice strong { font-weight: 600; display: block; margin-bottom: 0.2rem; }
.notice p { margin: 0; color: var(--ash); }
.notice .notice-detail { margin-top: 0.5rem; font-size: 0.8rem; color: var(--ash-dim); word-break: break-word; }
.notice-actions { display: flex; gap: 0.25rem; margin: 0.6rem 0 0 -0.6rem; flex-wrap: wrap; }

/* ---------- Sections ---------- */

.sections {
  display: flex;
  gap: 1.5rem;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 1.75rem;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.sections::-webkit-scrollbar { display: none; }
.section-tab {
  background: none;
  border: 0;
  padding: 0.5rem 0 0.75rem;
  color: var(--ash);
  font-size: 0.95rem;
  font-weight: 500;
  border-bottom: 1px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  flex: none;
}
.section-tab:hover { color: var(--bone); }
.section-tab[aria-pressed="true"] { color: var(--bone); border-bottom-color: var(--bone); }
.tab-count { color: var(--ash-dim); font-variant-numeric: tabular-nums; margin-left: 0.2rem; }
.section-tab[aria-pressed="true"] .tab-count { color: var(--ash); }
.composer { padding-bottom: 2rem; border-bottom: 1px solid var(--rule); }
#notice { margin: 0 0 1.5rem; }

/* ---------- Desk ---------- */

.desk { padding-top: 0.5rem; }

.batch-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding: 2.25rem 0 0.25rem;
}
.batch-title {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 1.02rem;
  color: var(--ash);
}
.batch-title .demo-tag,
.demo-tag {
  font-family: var(--sans);
  font-style: normal;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--ember);
  border: 1px solid rgba(228, 87, 46, 0.5);
  border-radius: 2px;
  padding: 0.1rem 0.35rem;
  margin-left: 0.4rem;
  vertical-align: 0.15em;
}
.batch-note {
  margin: 0.35rem 0 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 0.98rem;
  color: var(--ash-dim);
  max-width: 38em;
}

.post {
  position: relative;
  padding: 2.25rem 0 1.6rem;
  border-bottom: 1px solid var(--rule);
}
.post::before {
  content: "";
  position: absolute;
  left: calc(var(--gutter) * -0.6);
  top: 2.4rem;
  bottom: 1.8rem;
  width: 2px;
  background: transparent;
  transition: background-color 160ms ease;
}
.post.is-selected::before { background: var(--ember); }

.post-text {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  font-size: clamp(1.2rem, 2.6vw, 1.45rem);
  line-height: 1.46;
  font-weight: 500;
  letter-spacing: -0.003em;
  max-width: 32em;
  color: var(--bone);
}
.post-text.small { font-size: 1.05rem; line-height: 1.5; }

.post-meta {
  margin: 1rem 0 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1rem;
  color: var(--ash);
}
.post-note {
  margin: 0.25rem 0 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1rem;
  color: var(--ash-dim);
  max-width: 36em;
}
.flags { margin: 0.75rem 0 0; display: flex; gap: 0.9rem; flex-wrap: wrap; }
.flag {
  font-size: 0.78rem;
  color: var(--ash);
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.flag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--ash-dim); }
.flag.warn::before { background: var(--ember); }
.flag.edited::before { background: var(--bone); }

.post-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-top: 1.1rem;
  margin-left: -0.6rem;
}
.post-tools { display: flex; flex-wrap: wrap; }
.post-tools .button { font-weight: 500; font-size: 0.86rem; }

.select-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  background: none;
  color: var(--bone);
  padding: 0.5rem 0.95rem;
  min-height: 40px;
  font-size: 0.86rem;
  font-weight: 600;
}
.select-toggle:hover { border-color: var(--ash); }
.select-toggle .flame { width: 9px; height: 13px; display: none; }
.select-toggle .flame path { fill: var(--ember); }
.select-toggle[aria-pressed="true"] { border-color: var(--ember); color: var(--ember); }
.select-toggle[aria-pressed="true"] .flame { display: inline-block; }

.approved-stamp {
  font-family: var(--serif);
  font-style: italic;
  font-size: 0.98rem;
  color: var(--ash);
}

.collection-head {
  padding: 2rem 0 0.5rem;
  border-bottom: 1px solid var(--rule);
}
.collection-head p {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.02rem;
  color: var(--ash);
  max-width: 38em;
}
.collection-actions { display: flex; gap: 0.25rem; margin: 0.9rem 0 1rem -0.6rem; flex-wrap: wrap; }

.empty {
  padding: 4.5rem 0 3rem;
  max-width: 30em;
}
.empty h2 {
  margin: 0 0 0.6rem;
  font-size: 1.3rem;
  font-weight: 500;
}
.empty p {
  margin: 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.08rem;
  color: var(--ash);
}

.working {
  padding: 2.5rem 0 2.25rem;
  border-bottom: 1px solid var(--rule);
}
.working p { margin: 0; font-size: 1.1rem; }
.working .working-sub {
  margin-top: 0.35rem;
  font-family: var(--serif);
  font-style: italic;
  color: var(--ash);
  font-size: 1rem;
}
.fuse {
  margin-top: 1.4rem;
  height: 1px;
  background: var(--rule);
  position: relative;
  overflow: hidden;
}
.fuse::after {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 30%;
  background: var(--ember);
  animation: burn 1.8s ease-in-out infinite;
}
.working .button { margin: 0.9rem 0 0 -0.6rem; }

/* ---------- Selection bar ---------- */

.selection-bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.94);
  border-top: 1px solid var(--rule-strong);
  padding: 0.75rem var(--gutter) calc(0.75rem + env(safe-area-inset-bottom));
  z-index: 20;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.selection-inner {
  max-width: var(--column);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}
.selection-count { font-size: 0.92rem; color: var(--ember); font-weight: 600; font-variant-numeric: tabular-nums; }
.selection-actions { display: flex; align-items: center; gap: 0.15rem; }

/* ---------- Toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(5.25rem + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  background: var(--bone);
  color: var(--ink);
  padding: 0.7rem 1rem;
  border-radius: 2px;
  font-size: 0.9rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 1rem;
  z-index: 60;
  max-width: calc(100vw - 2rem);
}
.toast-action {
  background: none;
  border: 0;
  padding: 0.2rem 0;
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
  color: var(--ink);
}

/* ---------- Sheets (dialogs) ---------- */

dialog.sheet {
  background: var(--ink);
  color: var(--bone);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  padding: 0;
  width: min(100vw - 2rem, 62rem);
  max-height: calc(100dvh - 2rem);
  overflow: auto;
}
dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.82); }
.sheet-bar {
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem 1.5rem;
  background: var(--ink);
  border-bottom: 1px solid var(--rule);
  z-index: 2;
}
.sheet-title { margin: 0; font-size: 1rem; font-weight: 600; }
.sheet-meta { font-size: 0.82rem; color: var(--ash); font-variant-numeric: tabular-nums; text-align: right; }
.sheet-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  padding: 1rem 1.5rem calc(1rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--rule);
}
.sheet-actions.inline { border-top: 0; padding: 0.5rem 0 0; justify-content: flex-end; }
.sheet-actions-left, .sheet-actions-right { display: flex; gap: 0.25rem; flex-wrap: wrap; align-items: center; }
.aside-label {
  margin: 0 0 0.6rem;
  font-family: var(--serif);
  font-style: italic;
  color: var(--ash);
  font-size: 0.98rem;
}
.fine { font-size: 0.85rem; color: var(--ash); margin: 0; }
.fine em { font-style: normal; color: var(--bone); }

/* Editor: distraction-free, full screen */
dialog.editor {
  width: 100vw; height: 100dvh; max-width: none; max-height: none;
  border: 0; border-radius: 0;
  display: none;
  flex-direction: column;
}
dialog.editor[open] { display: flex; }
.editor-body {
  flex: 1;
  width: 100%;
  max-width: 40rem;
  margin: 0 auto;
  padding: clamp(1.5rem, 7vh, 5rem) var(--gutter) 1.5rem;
  display: flex;
  flex-direction: column;
}
.editor-text {
  flex: 1;
  width: 100%;
  min-height: 40vh;
  resize: none;
  background: transparent;
  border: 0;
  padding: 0;
  font-size: clamp(1.3rem, 3.4vw, 1.75rem);
  line-height: 1.5;
  font-weight: 500;
  color: var(--bone);
  caret-color: var(--ember);
}
.editor-text:focus { outline: none; }
.recovered {
  margin: 0 0 1.25rem;
  font-family: var(--serif);
  font-style: italic;
  color: var(--ember);
}
.editor-flags { margin: 1rem 0 0; min-height: 1.4em; font-size: 0.82rem; color: var(--ash); }
.editor-flags .warn { color: var(--ember); }

/* Revise */
.revise-body { padding: 1.5rem; }
.revise-current { padding-bottom: 1.5rem; border-bottom: 1px solid var(--rule); }
.revise-ask { padding: 1.5rem 0 0; }
.presets { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.preset {
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  background: none;
  color: var(--ash);
  padding: 0.5rem 0.8rem;
  font-size: 0.86rem;
  min-height: 38px;
}
.preset:hover { color: var(--bone); border-color: var(--ash-dim); }
.preset[aria-pressed="true"] { color: var(--bone); border-color: var(--bone); }
.revise-custom {
  margin-top: 1rem;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  padding: 0.75rem 0.85rem;
  font-size: 0.95rem;
  resize: vertical;
  min-height: 3.2rem;
}
.revise-custom::placeholder { color: var(--ash-dim); }
.revise-custom:focus { outline: none; border-color: var(--ash); }
.revise-go { display: flex; justify-content: flex-end; margin-top: 1rem; }
.revise-results:not(:empty) { margin-top: 1.75rem; }
.diagnosis {
  font-family: var(--serif);
  font-style: italic;
  color: var(--ash);
  font-size: 1.02rem;
  margin: 0 0 1.25rem;
  max-width: 44em;
}
.options {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 1px solid var(--rule);
}
.option {
  padding: 1.4rem 1.25rem 1.25rem;
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
}
.option:first-child { padding-left: 0; }
.option:last-child { border-right: 0; padding-right: 0; }
.option .post-text { font-size: 1.08rem; line-height: 1.5; flex: 1; }
.option .post-note { font-size: 0.95rem; margin-top: 0.9rem; }
.option .button { align-self: flex-start; margin-top: 1rem; }
.results-foot { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
.results-foot .button { margin-left: -0.6rem; }

/* Preview */
.preview-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 16rem;
  gap: 1.75rem;
  padding: 1.5rem;
  align-items: start;
}
.preview-stage {
  display: flex;
  justify-content: center;
  background: #070707;
  border: 1px solid var(--rule);
  padding: 1rem;
}
#preview-canvas {
  display: block;
  width: 100%;
  height: auto;
  max-height: calc(100dvh - 10rem);
  object-fit: contain;
  aspect-ratio: 1 / 1;
}
#preview-canvas.reel { aspect-ratio: 9 / 16; width: auto; max-width: 100%; max-height: calc(100dvh - 12rem); }
.preview-side { display: flex; flex-direction: column; gap: 1rem; }
.segmented { display: flex; border: 1px solid var(--rule-strong); border-radius: 2px; }
.segmented button {
  flex: 1;
  background: none;
  border: 0;
  padding: 0.55rem 0.5rem;
  min-height: 40px;
  color: var(--ash);
  font-size: 0.86rem;
  font-weight: 500;
}
.segmented button + button { border-left: 1px solid var(--rule-strong); }
.segmented button[aria-pressed="true"] { background: var(--bone); color: var(--ink); font-weight: 600; }
.preview-info { margin: 0; font-size: 0.85rem; color: var(--ash); font-variant-numeric: tabular-nums; }
.preview-density { margin: 0; font-size: 0.9rem; color: var(--ember); }
.preview-density:empty { display: none; }
.preview-actions .button { width: 100%; }

.check { display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.88rem; color: var(--ash); cursor: pointer; }
.check input { accent-color: var(--ember); margin-top: 0.25rem; }

/* Connection */
dialog.connection { width: min(100vw - 2rem, 34rem); }
.connection-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
.field { display: flex; flex-direction: column; gap: 0.45rem; font-size: 0.86rem; color: var(--ash); }
.field em { font-style: normal; color: var(--ash-dim); margin-left: 0.25rem; }
.field input {
  background: var(--surface);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  padding: 0.7rem 0.8rem;
  font-size: 0.92rem;
  color: var(--bone);
  min-height: 44px;
}
.field input:focus { outline: none; border-color: var(--ash); }
.field small { color: var(--ash-dim); font-size: 0.78rem; }
.connection-result { margin: 0; font-size: 0.88rem; min-height: 1.3em; color: var(--ash); }
.connection-result.ok { color: var(--bone); }
.connection-result.bad { color: var(--ember); }
.danger-zone { border-top: 1px solid var(--rule); padding-top: 1rem; margin-left: -0.6rem; }


/* ---------- Section heads, groups, chips ---------- */

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  padding: 0.25rem 0 1.25rem;
  border-bottom: 1px solid var(--rule);
  flex-wrap: wrap;
}
.section-title { margin: 0; font-size: 1.3rem; font-weight: 600; letter-spacing: 0.01em; }
.section-sub { margin: 0.45rem 0 0; font-size: 0.9rem; color: var(--ash); max-width: 40em; }
.section-sub a, .fine a, .mtable a { color: var(--bone); text-underline-offset: 3px; }
.section-actions { display: flex; flex-wrap: wrap; margin-right: -0.6rem; }
.group-title {
  margin: 2rem 0 0.25rem;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: 1.02rem;
  color: var(--ash);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
}
.group-title .button { font-family: var(--sans); font-style: normal; margin-right: -0.6rem; }
.chip {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--ash);
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  padding: 0.1rem 0.4rem;
  white-space: nowrap;
  vertical-align: 0.1em;
}
.chip.live { color: var(--bone); border-color: var(--ash-dim); }
.chip.warn { color: var(--ember); border-color: rgba(228, 87, 46, 0.55); }
.chip.gold { color: var(--bone); border-color: var(--bone); }
.warn-text { color: var(--ember); }
.inline-note { margin: 0 0 1rem; font-size: 0.9rem; color: var(--ash); }
.link { background: none; border: 0; padding: 0; color: var(--bone); text-decoration: underline; text-underline-offset: 3px; }
.empty-actions { display: flex; gap: 0.5rem; margin-top: 1.25rem; flex-wrap: wrap; }
.foot-note { margin-top: 2rem; }
small.block, .check small.block { display: block; color: var(--ash-dim); font-size: 0.8rem; margin-top: 0.15rem; }

/* ---------- Queue ---------- */

.qitem { padding: 1.25rem 0 0.9rem; border-bottom: 1px solid var(--rule); }
.qhead { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.qtime { font-weight: 600; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.qkind { font-size: 0.85rem; color: var(--ash); }
.qcheck input { accent-color: var(--ember); width: 18px; height: 18px; margin: 0; vertical-align: middle; }
.qtext { margin: 0.55rem 0 0; font-size: 1.02rem; line-height: 1.45; max-width: 36em; white-space: pre-wrap; }
.qmeta { margin: 0.4rem 0 0; font-size: 0.85rem; color: var(--ash); }
.qwarn { margin: 0.45rem 0 0; font-size: 0.86rem; color: var(--ember); max-width: 40em; }
.qtools { margin: 0.5rem 0 0 -0.6rem; }
.qtools .button { font-weight: 500; font-size: 0.84rem; min-height: 38px; }

/* ---------- Published ---------- */

.filters { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; padding: 1.25rem 0 0.5rem; }
.field.compact { flex: 1 1 14rem; }
.field.compact input { min-height: 42px; }
.more-filters { font-size: 0.86rem; color: var(--ash); }
.more-filters summary { cursor: pointer; padding: 0.25rem 0; }
.more-filters .filters { padding-top: 0.5rem; }
.field.date { flex-direction: row; align-items: center; gap: 0.5rem; }
.field.date input { width: auto; min-height: 42px; }
.mtable .ids { color: var(--ash-dim); word-break: break-all; }
.pitem { border-bottom: 1px solid var(--rule); }
.pitem-main {
  display: flex; flex-direction: column; gap: 0.4rem; width: 100%;
  background: none; border: 0; text-align: left; padding: 1.15rem 0; color: inherit;
}
.pitem-main:hover .pitem-text { color: #fff; }
.pitem-text { font-size: 1.02rem; line-height: 1.45; font-weight: 500; max-width: 36em; }
.pitem-meta { font-size: 0.84rem; color: var(--ash); font-variant-numeric: tabular-nums; }
.pitem-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }

dialog.detail { width: min(100vw - 2rem, 58rem); }
.detail-body { padding: 1.5rem; }
.detail-text { margin-bottom: 1.5rem; }
.table-wrap { overflow-x: auto; border-top: 1px solid var(--rule); }
.mtable { width: 100%; border-collapse: collapse; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
.mtable th { text-align: left; font-weight: 600; color: var(--ash); padding: 0.6rem 0.75rem 0.6rem 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.mtable td { padding: 0.7rem 0.75rem 0.7rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.detail-actions .post-tools { margin-left: -0.6rem; }
.detail-actions .group-title { margin-top: 1.5rem; }

/* ---------- Gold ---------- */

.gitem { padding: 1.5rem 0 1rem; border-bottom: 1px solid var(--rule); }
.gitem .post-tools { margin: 0.6rem 0 0 -0.6rem; }
.gitem.quiet .qtext { color: var(--ash); }

/* ---------- Settings ---------- */

.settings-nav { display: flex; flex-wrap: wrap; gap: 0.35rem 1.1rem; padding: 1rem 0 0.5rem; font-size: 0.86rem; }
.settings-nav a { color: var(--ash); text-decoration: none; }
.settings-nav a:hover { color: var(--bone); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 1.25rem; }

.field select, .field input[type="number"], .field input[type="text"], .field input[type="search"], .field input[type="datetime-local"] {

}
.field input:focus, .field select:focus { outline: none; border-color: var(--ash); }
.select.wide { display: block; }
.select.wide select { width: 100%; background: var(--surface); }
.radio-col { display: flex; flex-direction: column; gap: 0.75rem; }
.radio-row { display: flex; flex-direction: column; gap: 0.5rem; margin: 1rem 0; }
.check input[type="radio"] { accent-color: var(--ember); margin-top: 0.3rem; }
.check span { color: var(--bone); }
.kv div { display: flex; gap: 0.75rem; font-size: 0.9rem; flex-wrap: wrap; }
.kv span { color: var(--ash); }
.kv strong { font-weight: 500; word-break: break-all; }
.checks { list-style: none; margin: 1rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; font-size: 0.88rem; color: var(--ash); }
.checks li { padding-left: 1.1rem; position: relative; }
.checks li::before { content: ""; position: absolute; left: 0; top: 0.5em; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ember); }
.checks li.ok::before { background: var(--ember); }
.checks strong { color: var(--bone); font-weight: 600; margin-right: 0.35rem; }
.limits { margin-top: 1rem; font-size: 0.85rem; color: var(--ash); }
.limits summary { cursor: pointer; color: var(--bone); }
.limits ul { margin: 0.6rem 0 0; padding-left: 1.1rem; }
.tracks, .results { list-style: none; margin: 1rem 0 0; padding: 0; }
.tracks li, .results li { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: 0.85rem 0; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.track-main { flex: 1 1 18rem; font-size: 0.92rem; }
.track-main audio { display: block; margin-top: 0.5rem; width: 100%; max-width: 22rem; height: 34px; }
.track-role { display: inline-block; min-width: 4.8rem; font-size: 0.78rem; color: var(--ash); font-weight: 600; letter-spacing: 0.04em; }
.tracks .post-tools, .results .post-tools { margin-right: -0.6rem; }
.audio-search { margin-top: 0.5rem; }
dialog.small-sheet { width: min(100vw - 2rem, 28rem); }


/* ---------- Console additions ---------- */

.sub-title { margin: 1.5rem 0 0.25rem; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ash); }
.check-result { margin: 0; font-size: 0.86rem; }
.check-result.ok { color: var(--bone); }
.check-result.bad { color: var(--ember); }
.day-title { margin: 1.25rem 0 0; font-size: 0.86rem; font-weight: 600; color: var(--ash); }
.inline-select select { min-height: 34px; padding-top: 0.3rem; padding-bottom: 0.3rem; font-size: 0.82rem; }
.jobs { border: 1px solid var(--rule-strong); border-radius: 2px; padding: 0.5rem 1rem; margin: 0.75rem 0 1rem; }
.job { display: flex; justify-content: space-between; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--rule); font-size: 0.88rem; flex-wrap: wrap; }
.job:last-of-type { border-bottom: 0; }
.job-text { color: var(--bone); flex: 1 1 16rem; }
.job-step { color: var(--ash); font-variant-numeric: tabular-nums; }
.job.ok .job-step { color: var(--bone); }
.job.bad .job-step { color: var(--ember); flex-basis: 100%; }
.log { margin: 1rem 0 0; padding: 0.75rem 1rem; background: var(--surface); border-left: 2px solid var(--ember); }
.log ul { margin: 0; padding-left: 1.1rem; font-size: 0.88rem; color: var(--ash); }
.log .aside-label { margin-bottom: 0.3rem; }
.plain { margin: 0; padding-left: 1.1rem; font-size: 0.9rem; color: var(--ash); display: flex; flex-direction: column; gap: 0.6rem; max-width: 44em; }

.foot-actions { margin: 1.5rem 0 0 -0.6rem; }
#preview-video { display: block; width: auto; max-width: 100%; max-height: calc(100dvh - 12rem); aspect-ratio: 9 / 16; background: #000; }
.preview-actions { display: flex; flex-direction: column; gap: 0.4rem; }

/* ---------- Motion ---------- */

@keyframes burn {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(340%); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .fuse::after { width: 100%; opacity: 0.6; }
}

/* ---------- Small screens ---------- */

@media (max-width: 760px) {
  .grid2 { grid-template-columns: 1fr; }

  .option:last-child { border-bottom: 0; }
  .preview-body { grid-template-columns: 1fr; padding: 1rem; gap: 1.25rem; }
  #preview-canvas { max-height: 62dvh; }
}

@media (max-width: 560px) {
  dialog.sheet {
    width: 100vw; max-width: 100vw;

  }

  .post-actions .approved-stamp { margin-left: 0.6rem; }

  .sheet-actions-left { order: 2; width: 100%; margin-left: -0.6rem; }

}

<body>
  <div class="shell">
    <header class="masthead">
      <div class="mark">
        <svg class="match" viewBox="0 0 24 40" aria-hidden="true">
          <line x1="6" y1="38" x2="16" y2="13" />
          <path d="M17.5 2.5c3.2 3.4 3.6 6.9 1 9.1c-2.2 1.8-5 .2-4.6-2.6c.3-2.4 2.9-3.5 3.6-6.5z" />
        </svg>
        <div>
          <h1 class="wordmark">RAISE HELL</h1>
          <p class="studio">EDITORIAL STUDIO</p>
        </div>
      </div>
      <button class="status" id="status" type="button" data-view="settings" aria-label="Connections">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">Setup needed</span>
      </button>
    </header>

    <nav class="sections" aria-label="Sections">
      <button type="button" class="section-tab" data-view="studio">Studio <span class="tab-count" data-count="studio"></span></button>
      <button type="button" class="section-tab" data-view="queue">Queue <span class="tab-count" data-count="queue"></span></button>
      <button type="button" class="section-tab" data-view="published">Published</button>
      <button type="button" class="section-tab" data-view="gold">Gold Standards</button>
      <button type="button" class="section-tab" data-view="settings">Settings</button>
    </nav>

    <div class="notice" id="notice" role="alert" hidden></div>

    <section class="composer" id="composer" aria-label="Generate posts">
      <form id="generate-form" autocomplete="off">
        <label class="visually-hidden" for="theme">What are we writing about?</label>
        <textarea id="theme" class="theme" rows="1" maxlength="400" placeholder="What are we writing about? Leave blank to surprise me."></textarea>
        <div class="composer-row">
          <div class="composer-options">
            <label class="select"><span class="visually-hidden">Number of candidates</span>
              <select id="count"><option value="5">5 posts</option><option value="10" selected>10 posts</option><option value="15">15 posts</option><option value="20">20 posts</option></select>
            </label>
            <label class="select"><span class="visually-hidden">Emotional direction</span>
              <select id="direction">
                <option value="Mixed" selected>Mixed feeling</option>
                <option value="Fire">Fire: courage, defiance</option>
                <option value="Truth">Truth: recognition, contradiction</option>
                <option value="Heart">Heart: love, family, tenderness</option>
                <option value="Perspective">Perspective: time, what matters</option>
                <option value="Swagger">Swagger: humor, nerve, delight</option>
              </select>
            </label>
          </div>
          <button class="button primary" id="generate" type="submit">Generate</button>
        </div>
      </form>
    </section>

    <main id="desk" class="desk" aria-live="polite"></main>
  </div>

  <div class="selection-bar" id="selection-bar" hidden>
    <div class="selection-inner">
      <span class="selection-count" id="selection-count"></span>
      <div class="selection-actions" id="selection-actions"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden><span class="toast-text"></span><button type="button" class="toast-action" hidden></button></div>

  <dialog class="sheet editor" id="editor" aria-labelledby="editor-title">
    <div class="sheet-bar"><h2 class="sheet-title" id="editor-title">Edit</h2><div class="sheet-meta" id="editor-meta"></div></div>
    <div class="editor-body">
      <p class="recovered" id="editor-recovered" hidden>Recovered an unsaved edit from your last session.</p>
      <textarea id="editor-text" class="editor-text" spellcheck="true" aria-label="Post text"></textarea>
      <p class="editor-flags" id="editor-flags"></p>
    </div>
    <div class="sheet-actions">
      <div class="sheet-actions-left">
        <button type="button" class="button quiet" data-action="editor-restore">Restore original</button>
        <button type="button" class="button quiet" data-action="editor-revise">Revise with Claude</button>
      </div>
      <div class="sheet-actions-right">
        <button type="button" class="button quiet" data-action="editor-cancel">Cancel</button>
        <button type="button" class="button primary" data-action="editor-save">Save</button>
      </div>
    </div>
  </dialog>

  <dialog class="sheet revise" id="revise" aria-labelledby="revise-title">
    <div class="sheet-bar"><h2 class="sheet-title" id="revise-title">Sharpen</h2><button type="button" class="button quiet" data-action="revise-close">Close</button></div>
    <div class="revise-body">
      <div class="revise-current"><p class="aside-label">Current version</p><div class="post-text small" id="revise-original"></div></div>
      <div class="revise-ask">
        <div class="presets" role="group" aria-label="Revision direction">
          <button type="button" class="preset" data-preset="Make it hit harder." aria-pressed="false">Make it hit harder</button>
          <button type="button" class="preset" data-preset="More raw." aria-pressed="false">More raw</button>
          <button type="button" class="preset" data-preset="More emotionally devastating." aria-pressed="false">More emotionally devastating</button>
          <button type="button" class="preset" data-preset="More concise." aria-pressed="false">More concise</button>
          <button type="button" class="preset" data-preset="More unexpected." aria-pressed="false">More unexpected</button>
        </div>
        <label class="visually-hidden" for="revise-custom">Custom instruction</label>
        <textarea id="revise-custom" class="revise-custom" rows="2" maxlength="600" placeholder="Or tell Claude exactly what to change. Optional."></textarea>
        <div class="revise-go"><button type="button" class="button primary" data-action="revise-request">Get 3 revisions</button></div>
      </div>
      <div class="revise-results" id="revise-results" aria-live="polite"></div>
    </div>
  </dialog>

  <dialog class="sheet preview" id="preview" aria-labelledby="preview-title">

        <canvas id="preview-canvas" width="1080" height="1920" aria-label="Rendered post"></canvas>

      </div>
      <div class="preview-side">
        <div class="segmented" role="group" aria-label="Format">
          <button type="button" data-format="reel" aria-pressed="true">Reel</button>
          <button type="button" data-format="story" aria-pressed="false">Story</button>
        </div>
        <label class="check" id="guides-toggle"><input type="checkbox" id="preview-guides" checked><span>Show Instagram safe area</span></label>
        <p class="preview-info" id="preview-info"></p>
        <p class="preview-density" id="preview-density"></p>
        <div class="preview-actions">
          <button type="button" class="button outline" data-action="preview-video">Make the Reel video</button>
          <button type="button" class="button quiet" data-action="preview-download">Download</button>
        </div>
        <p class="fine" id="preview-note"></p>
      </div>
    </div>
  </dialog>

      <p class="fine" id="schedule-note"></p>

      <div class="sheet-actions inline">
        <button type="button" class="button quiet" data-action="schedule-close">Cancel</button>
        <button type="submit" class="button primary">Schedule</button>
      </div>
    </form>
  </dialog>

    <div class="detail-body" id="detail-body"></div>
  </dialog>

  <script>
/*
  RAISE HELL console defaults. This file is public on GitHub Pages:
  never put an API key, token or passphrase here. Keys are entered in
  Settings and stay in the browser that uses them.

  n8nUrl: production webhook of the existing "Raise Hell - Generation"
          workflow, for example

          (not /webhook-test/). Optional: it can also be entered in Settings.

  mediaScheduleDays: how far ahead a Reel or Story may be scheduled after
          its media is uploaded. Zernio keeps an upload in temporary storage
          for 7 days and moves it to permanent storage when the post
          publishes, so a post must publish inside that window. 6 leaves a
          day of margin. Do not raise it unless Zernio confirms in writing
          that scheduled media is kept until publication.
*/
window.RAISEHELL_CONFIG = {
  n8nUrl: '',
  githubRepo: 'jolthevc/raisehell',
  githubBranch: 'main',
  timezone: 'America/Los_Angeles',
  generateTimeoutMs: 240000,
  reviseTimeoutMs: 120000,
  mediaScheduleDays: 6
};

</script>
  <script>
/*
  RAISE HELL renderer.

  Typesets post copy onto a canvas exactly the way the finished Instagram
  asset should look: black field, off-white type, nothing else.
  Everything happens in the browser. No external image service.

  Used for the previews and for the published media (video.js), so a Reel
  or Story sent to Zernio is typeset exactly like the preview.
*/
(function (global) {
  'use strict';

  var FONT_FAMILY = '"Libre Franklin", "Helvetica Neue", Arial, sans-serif';
  var createCanvas = function (w, h) {
    var c = document.createElement('canvas');
    if (w) c.width = w;
    if (h) c.height = h;
    return c;
  };
  var FONT_WEIGHT = 500;
  var BACKGROUND = '#000000';
  var INK = '#F2EEE6';
  var LINE_HEIGHT = 1.34;     // multiple of font size
  var PARAGRAPH_GAP = 0.72;   // extra space between paragraphs, multiple of font size

  // Safe areas are measured in output pixels.
  // Reel insets keep copy clear of Instagram's top bar, the caption and
  // audio row at the bottom, and the action buttons on the right.
  // These are conservative working values; verify against current
  // Instagram behavior before automating publishing.
  var FORMATS = {
    square: {
      label: 'Square 1080 × 1080',
      width: 1080, height: 1080,
      safe: { top: 130, right: 120, bottom: 130, left: 120 },
      maxSize: 76, minSize: 40, denseBelow: 48
    },
    reel: {
      label: 'Reel 1080 × 1920',
      width: 1080, height: 1920,
      safe: { top: 270, right: 170, bottom: 500, left: 100 },
      maxSize: 76, minSize: 40, denseBelow: 48
    },
    // Stories: clear of the progress bar and profile row at the top and the
    // reply bar at the bottom. No stickers, links or music are ever added.
    story: {
      label: 'Story 1080 × 1920',
      width: 1080, height: 1920,
      safe: { top: 280, right: 120, bottom: 360, left: 120 },
      maxSize: 80, minSize: 42, denseBelow: 50
    }
  };

  var measureCanvas = null;
  function measureContext() {
    if (!measureCanvas) measureCanvas = createCanvas(16, 16);
    return measureCanvas.getContext('2d');
  }

  // Server use: configure({ createCanvas: (w, h) => canvas }).
  function configure(opts) {
    if (opts && typeof opts.createCanvas === 'function') { createCanvas = opts.createCanvas; measureCanvas = null; }
  }

  function fontString(size) {
    return FONT_WEIGHT + ' ' + size + 'px ' + FONT_FAMILY;
  }

  // Normalize without changing the writing: unify newlines, drop trailing
  // spaces, trim blank lines at the very start and end. Paragraph breaks
  // (blank lines) and single line breaks are both preserved.
  function normalize(text) {
    return String(text == null ? '' : text)
      .replace(/\r\n?/g, '\n')
      .replace(/[ \t]+\n/g, '\n')
      .replace(/^\s*\n/, '')
      .replace(/\n\s*$/, '')
      .trim();
  }

  // paragraphs -> hard lines -> words
  function structure(text) {
    var clean = normalize(text);
    if (!clean) return [];
    return clean.split(/\n[ \t]*\n+/).map(function (para) {
      return para.split('\n').map(function (line) {
        return line.trim().split(/\s+/).filter(Boolean);
      }).filter(function (words) { return words.length; });
    }).filter(function (p) { return p.length; });
  }

  function wrapWords(ctx, words, maxWidth) {
    var lines = [];
    var current = [];
    function width(arr) { return ctx.measureText(arr.join(' ')).width; }

    words.forEach(function (word) {
      // A single word wider than the column is split by characters (rare).
      if (ctx.measureText(word).width > maxWidth) {
        if (current.length) { lines.push(current); current = []; }
        var piece = '';
        for (var i = 0; i < word.length; i++) {
          if (ctx.measureText(piece + word[i]).width > maxWidth && piece) {
            lines.push([piece]); piece = '';
          }
          piece += word[i];
        }
        current = [piece];
        return;
      }
      var attempt = current.concat(word);
      if (current.length && width(attempt) > maxWidth) {
        lines.push(current);
        current = [word];
      } else {
        current = attempt;
      }
    });
    if (current.length) lines.push(current);

    // Avoid stranding a single short word on the last line when the line
    // above can spare one. Purely typographic; the words never change.
    if (lines.length >= 2) {
      var last = lines[lines.length - 1];
      var prev = lines[lines.length - 2];
      if (last.length === 1 && prev.length >= 4) {
        var moved = prev[prev.length - 1];
        var candidate = [moved].concat(last);
        if (width(candidate) <= maxWidth) {
          lines[lines.length - 2] = prev.slice(0, -1);
          lines[lines.length - 1] = candidate;
        }
      }
    }
    return lines.map(function (arr) { return arr.join(' '); });
  }

  function layoutAt(ctx, paragraphs, size, boxWidth) {
    ctx.font = fontString(size);
    var lineHeight = size * LINE_HEIGHT;
    var gap = size * PARAGRAPH_GAP;
    var lines = [];
    var y = 0;
    var widest = 0;
    paragraphs.forEach(function (para, pIndex) {
      if (pIndex > 0) y += gap;
      para.forEach(function (hardLine) {
        wrapWords(ctx, hardLine, boxWidth).forEach(function (str) {
          lines.push({ text: str, y: y, paragraph: pIndex });
          widest = Math.max(widest, ctx.measureText(str).width);
          y += lineHeight;
        });
      });
    });
    // Visual height: from the cap height of the first line to the baseline
    // of the last line. Used for optical centering.
    var cap = ctx.measureText('H').actualBoundingBoxAscent || size * 0.72;
    var visualHeight = lines.length ? (lines[lines.length - 1].y + cap) : 0;
    return { size: size, lines: lines, lineHeight: lineHeight, cap: cap, visualHeight: visualHeight, widest: widest };
  }

  /*
    Fit copy into a format. Tries the largest size first and steps down
    until the block fits the safe area. Never goes below minSize; copy that
    still does not fit is flagged instead of shrunk into illegibility.
  */
  function layout(text, formatName) {
    var format = FORMATS[formatName || 'square'];
    var ctx = measureContext();
    var paragraphs = structure(text);
    var boxWidth = format.width - format.safe.left - format.safe.right;
    var boxHeight = format.height - format.safe.top - format.safe.bottom;
    var result = null;

    if (!paragraphs.length) {
      return { format: formatName, size: format.maxSize, lines: [], fits: true, density: 'empty', boxWidth: boxWidth, boxHeight: boxHeight };
    }

    for (var size = format.maxSize; size >= format.minSize; size -= 1) {
      result = layoutAt(ctx, paragraphs, size, boxWidth);
      if (result.visualHeight <= boxHeight) {
        result.fits = true;
        break;
      }
      result.fits = false;
    }

    result.format = formatName || 'square';
    result.boxWidth = boxWidth;
    result.boxHeight = boxHeight;
    result.density = !result.fits ? 'overflow' : (result.size < format.denseBelow ? 'dense' : 'comfortable');
    return result;
  }

    ui.zLoading = true;

    var acc = accId();
    var from = T.dayKey(now() - 365 * DAY, 'UTC');
    return Promise.all([
      S.zernio.listPosts(postQuery(), 5),
      S.zernio.analytics({ accountId: acc, platform: 'instagram', fromDate: from }, 5).catch(function (e) { return { items: [], error: e }; }),
      S.zernio.publishingLimit(acc).catch(function () { return null; })

  /*
    Each time the console loads Zernio's data, while the page is open:

      }

    if (!set().music.tracks.length) return notice({ title: 'Choose a Reel track first.', message: 'Settings, Instagram music. Reels are never published without music.' });
    var s = set();
    if (!at && !profId()) return notice({ title: 'Find the Instagram account in Settings first.' });
    if (storyDelay() >= MEDIA_WINDOW) return notice({ title: 'The Story delay is too long.', message: windowText() + ' Shorten "Hours after the Reel" in Settings, Stories.' });

            timezone: tz(),
            tags: ['raisehell', 'rh-reel'],

  /* ================= Gold Standards archive (GitHub) ================= */

  /* ---------- Schedule dialog ---------- */

  // Latest allowed time in the schedule dialog: the media of every post involved must publish inside its upload window.
  function scheduleLimit(sc) {

    var story = p && !isStoryPost(p) ? storyFor(p._id) : null;

    var own = p && p.recycledFromPostId ? Infinity : (mediaDeadline(p) || now() + MEDIA_WINDOW); // a repost reuses media made permanent when the original published

          var rest = ui.gold.entries.filter(function (x) { return x.key !== gk; });
          if (rest.length !== ui.gold.entries.length) return writeGold(rest, 'Remove a Gold Standard (owner)');
        }).then(function () { toast(a === 'g-exclude' ? 'Excluded from Gold Standards.' : 'Removed from Gold Standards.'); afterGold(); }, fail);
        break;
      }

      case 'test-n8n':
        saveBlock($('form[data-block="connections"]'), true);
        // A real one-post generation: the only way to confirm the request and response shapes match.
        ui.checks.n8n = { ok: true, text: 'Asking the workflow for one post. This calls Claude once and can take a minute.' }; render();
        S.n8n({ action: 'generate', count: 1, theme: '', direction: '', avoid_topics: [] }, { timeoutMs: CONFIG.generateTimeoutMs }).then(function (r) {
          ui.checks.n8n = r.posts.length ? { ok: true, text: 'The workflow answered with ' + plural(r.posts.length, 'post') + ' in the expected shape: "' + excerpt(r.posts[0].text, 70) + '". It was not added to the desk.' }
            : { ok: false, text: 'The workflow answered in the expected shape, but with no post text.' };
        }, function (er) { ui.checks.n8n = { ok: false, text: er.message + ' ' + er.detail }; }).then(render);
        break;
      case 'test-zernio':
        saveBlock($('form[data-block="connections"]'), true);
        S.zernio.accounts().then(function (list) {
          ui.accounts = list;
          if (!list.length) { ui.checks.zernio = { ok: false, text: 'The key works, but no Instagram account is connected in Zernio yet.' }; return; }
          var acc = list.filter(function (x) { return x._id === s.zernio.accountId; })[0] || list[0];
          pickAccount(acc);
          ui.checks.zernio = { ok: true, text: 'Found ' + plural(list.length, 'Instagram account') + '. Using @' + acc.username + '.' };
        }, function (er) { ui.checks.zernio = { ok: false, text: er.message + ' ' + er.detail }; }).then(function () { render(); refresh(); });
        break;
      case 'pick-account': { var id = $('#account-pick').value, acc2 = (ui.accounts || []).filter(function (x) { return x._id === id; })[0]; if (acc2) { pickAccount(acc2); ui.z = null; render(); refresh(); } break; }
      case 'test-github':
        saveBlock($('form[data-block="connections"]'), true);
        S.github.read(GOLD_PATH).then(function (f) { ui.checks.github = { ok: true, text: (f ? 'Read ' + GOLD_PATH + '.' : GOLD_PATH + ' does not exist yet; it will be created.') + (s.github.token ? ' Changes will be saved directly.' : ' No token: changes will download the file.') }; }, function (er) { ui.checks.github = { ok: false, text: er.message + ' ' + er.detail }; }).then(render);
        break;

      case 'audio-search': searchAudio(); break;
      case 'track-add': {
        var rid = t.closest('[data-result]').dataset.result, res = (ui.audioResults || []).filter(function (x) { return x.audioId === rid; })[0];
        if (!res) break;
        var tr = { audioId: res.audioId, title: res.title || res.audioId, artist: res.displayArtist || res.igUsername || '' };
        var list2 = s.music.tracks.filter(function (x) { return x.audioId !== rid; });
        if (t.dataset.role === 'default') list2.unshift(tr); else list2.push(tr);
        s.music.tracks = list2.slice(0, 3); save(true); render(); toast(t.dataset.role === 'default' ? 'Default track set.' : 'Backup track added.');
        break;
      }
      case 'track-default': case 'track-remove': {
        var tid = t.closest('[data-track]').dataset.track, cur = s.music.tracks.filter(function (x) { return x.audioId === tid; })[0];
        s.music.tracks = s.music.tracks.filter(function (x) { return x.audioId !== tid; });
        if (a === 'track-default') s.music.tracks.unshift(cur);
        save(true); render();
        break;
      }
      case 'check-tracks': checkTracks(); break;
      case 'export-data': download(new Blob([JSON.stringify(exportable(), null, 2)], { type: 'application/json' }), 'raisehell-console.json'); break;
      case 'import-data': importData(); break;
      case 'clear-data': if (confirm('Clear every draft and setting in this browser? Posts in Zernio are not affected.')) { try { localStorage.removeItem(STORE); } catch (er) { /* ignore */ } data = defaults(); ui.z = null; ui.gold = null; render(); } break;
      case 'demo-reset': if (confirm('Reset the demo?')) { window.RHDemo.reset(); ui.z = null; ui.gold = null; refresh(); toast('Demo reset.'); } break;
      case 'schedule-close': $('#schedule').close(); ui.schedule = null; break;
    }
  });

  function pickAccount(acc) {
    var z = set().zernio;
    z.accountId = acc._id;
    z.profileId = acc.profileId && typeof acc.profileId === 'object' ? acc.profileId._id : acc.profileId || '';
    z.accountName = acc.username || acc.displayName || '';
    z.loginMethod = acc.metadata && acc.metadata.loginMethod ? acc.metadata.loginMethod : (acc.metadata && acc.metadata.instagramScopedId ? 'instagram_login' : '');
    save(true);
  }

  function searchAudio() {
    var q = ($('#audio-q') || {}).value || '', type = ($('#audio-type') || {}).value || 'music';
    if (!zernioReady()) return notice({ title: 'Connect Zernio and find the account first.' });
    S.zernio.searchAudio(accId(), q.trim(), type).then(function (list) {
      ui.audioResults = list;
      if (!set().demo && set().zernio.loginMethod !== 'facebook_login') { set().zernio.loginMethod = 'facebook_login'; save(true); }
      render();
      var el = $('#audio-q'); if (el) el.value = q;
    }, function (e) {
      if (e.body && e.body.code === 'instagram_audio_requires_facebook_login') { set().zernio.loginMethod = 'instagram_login'; save(true); }
      fail(e); render();
    });
  }

  function checkTracks() {
    set().music.tracks.reduce(function (p, tr) {
      return p.then(function () { return S.zernio.checkAudio(accId(), tr.audioId); }).then(function (r) { ui.checks['track:' + tr.audioId] = { ok: r.ok, text: r.reason || '' }; });
    }, Promise.resolve()).then(function () { render(); toast('Tracks checked.'); }, fail);
  }

  function exportable() {
    var copy = JSON.parse(JSON.stringify(data));
    copy.settings.zernio.key = ''; copy.settings.zernio.passphrase = ''; copy.settings.github.token = ''; copy.settings.n8n.key = '';
    return copy;
  }
  function importData() {
    var el = document.createElement('input');
    el.type = 'file'; el.accept = 'application/json';
    el.onchange = function () {
      var f = el.files[0];
      if (!f) return;
      f.text().then(function (txt) {
        var keep = data.settings;
        data = merge(defaults(), JSON.parse(txt));
        ['key', 'passphrase'].forEach(function (k) { data.settings.zernio[k] = data.settings.zernio[k] || keep.zernio[k]; });
        data.settings.github.token = data.settings.github.token || keep.github.token;
        data.settings.n8n.key = data.settings.n8n.key || keep.n8n.key;
        save(true); render(); toast('Imported. Keys were kept from this browser.');
      }).catch(function () { notice({ title: 'That file is not a console export.' }); });
    };
    el.click();
  }

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.action === 'pick-track') { var d = draftFrom(t); if (d) ui.trackFor[d.id] = t.value; }
    if (t.dataset.action === 'policy') { set().music.policy = t.value; save(true); toast(t.value === 'rotate' ? 'Reels rotate between the saved tracks.' : 'Reels use the default track.'); }
    var keys = { 'pub-sort': 'sort', 'pub-kind': 'kind', 'pub-from': 'from', 'pub-to': 'to' };
    if (keys[t.id]) { data.published[keys[t.id]] = t.value; save(); render(); }
    if (t.id === 'pub-gold') { data.published.gold = t.checked; save(); if (!ui.gold) loadGold(); render(); }
    if (t.dataset.path === 'zernio.mode' || t.dataset.path === 'demo') saveBlock(t.closest('form'), true);
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'pub-q') { data.published.q = e.target.value; save(); render(); } });
  document.addEventListener('keydown', function (e) { if (e.target.id === 'audio-q' && e.key === 'Enter') { e.preventDefault(); searchAudio(); } });
  document.addEventListener('submit', function (e) { if (e.target.classList.contains('settings-form')) { e.preventDefault(); saveBlock(e.target); } });

  $('.toast-action').addEventListener('click', function () { var u = toastUndo; $('#toast').hidden = true; toastUndo = null; if (u) u(); });
  $('#generate-form').addEventListener('submit', function (e) { e.preventDefault(); generate(); });
  var theme = $('#theme');
  function grow() { theme.style.height = 'auto'; theme.style.height = theme.scrollHeight + 'px'; }
  theme.addEventListener('input', function () { grow(); data.composer.theme = theme.value; save(); });
  theme.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); } });
  $('#count').addEventListener('change', function () { data.composer.count = Number(this.value); save(); });
  $('#direction').addEventListener('change', function () { data.composer.direction = this.value; save(); });
  $('#editor-text').addEventListener('input', onEdit);
  $('#editor').addEventListener('keydown', function (e) { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); saveEditor(); } });
  $('#editor').addEventListener('cancel', function (e) { e.preventDefault(); closeEditor(false); });
  $('#revise').addEventListener('cancel', function (e) { e.preventDefault(); closeRevise(); });
  $('#preview-guides').addEventListener('change', drawPreview);
  $('#schedule-form').addEventListener('submit', submitSchedule);
  ['preview', 'revise', 'detail', 'schedule'].forEach(function (id) {
    var dlg = document.getElementById(id);
    dlg.addEventListener('click', function (e) {
      if (e.target !== dlg) return;
      var r = dlg.getBoundingClientRect();
      if (!(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom)) { if (id === 'revise') closeRevise(); else dlg.close(); }
    });
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && ui.z && now() - ui.z.loadedAt > 5 * 60000) refresh(true); });

  /* ================= Boot ================= */

  theme.value = data.composer.theme || '';
  $('#count').value = String(data.composer.count || 10);
  $('#direction').value = data.composer.direction || 'Mixed';
  grow();
  render();
  R.ready().then(render);
  if (zernioReady()) refresh();
  if (data.editing && draft(data.editing.id)) openEditor(draft(data.editing.id), data.editing.text);
  window.RHConsole = { data: function () { return data; }, ui: function () { return ui; }, refresh: refresh };
})();

</script>
</body>
</html>
